# Entry for the awesome-dsh-plugin catalogue.
#
# Copy this file to data/plugins/KeinsteinNUS__dsh-speech-polish.yml in a fork of
# https://github.com/awesome-dsh-plugin/awesome-dsh-plugin and open one PR.
# The README and the website are generated from data/plugins/*.yml, so the entry
# file is the whole submission.
#
# CI checks, in order: entry count (max 3 per PR), `dsh.bundle` in package.json,
# repo age >= 1 day, awesome-lint + site build. The `dsh-plugin` topic is already
# set on the repository.

url: https://github.com/KeinsteinNUS/dsh-speech-polish
name: KeinsteinNUS/dsh-speech-polish
category: voice
description:
  en: 'Adds a terminology-aware correction pass to the built-in local speech-to-text: keeps DSH''s own microphone and SenseVoice engine (audio never leaves the machine) and fixes homophones, domain terms and malformed numbers in the finished transcript.'
  zh: '给内置本地语音转写加一层术语纠错：沿用自带的麦克风与 SenseVoice 引擎（音频不出本机），在文字进入输入框前修正同音字、专业名词与数字写法。'
icon: https://raw.githubusercontent.com/KeinsteinNUS/dsh-speech-polish/main/assets/icon-180.png
# Prebuilt tarball on the GitHub release, pinned to the tag so a versioned
# filename never rots to 404 after the next release.
tarball: https://github.com/KeinsteinNUS/dsh-speech-polish/releases/download/v0.1.0/dsh-speech-polish-0.1.0.tgz
