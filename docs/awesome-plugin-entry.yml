# Entry for the awesome-dsh-plugin catalogue.
#
# How to submit (see https://github.com/awesome-dsh-plugin/awesome-dsh-plugin):
#   fork the repo, add this file as
#     data/plugins/KeinsteinNUS__dsh-speech-polish.yml
#   then open a pull request. The README and the website regenerate from these
#   YAML files automatically; no other files need to change.
